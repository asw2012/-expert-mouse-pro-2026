name: Build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install verified installer compiler
        run: .\installer\install-build-tools.ps1
      - name: Build, test and package
        run: .\installer\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installation-assets
          path: |
            dist/ExpertMousePro2026-Setup-*-win-x64.exe
            dist/ExpertMousePro2026-Source-*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
