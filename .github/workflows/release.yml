name: Publish Windows release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Validate version tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $version = $env:TAG_NAME.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Use a version tag such as v0.1.0.' }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Install verified installer compiler
        run: .\installer\install-build-tools.ps1
      - name: Build and validate release
        run: .\installer\build.ps1 -Version $env:RELEASE_VERSION
      - name: Create experimental release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = "v$($env:RELEASE_VERSION)"
          $assets = @(
            ".\dist\ExpertMousePro2026-Setup-$($env:RELEASE_VERSION)-win-x64.exe",
            ".\dist\ExpertMousePro2026-Source-$($env:RELEASE_VERSION).zip",
            '.\dist\SHA256SUMS.txt'
          )
          gh release create $tag @assets --verify-tag --prerelease `
            --title "Expert Mouse Pro 2026 $($env:RELEASE_VERSION)" `
            --notes-file .\installer\release-notes.txt
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
